name: Catálogo

# Lee onepace.net una vez al día (no desde cada teléfono) y publica catalog.json si cambió.
# La app descarga ese archivo desde raw.githubusercontent.com.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

# Solo puede escribir en el repo (commit del catálogo). Acciones fijadas por SHA.
permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Pruebas del lector
        working-directory: tools/catalog
        run: npm test
      - name: Generar catálogo
        working-directory: tools/catalog
        run: npm run sync
      - name: Publicar si cambió
        run: |
          if git diff --quiet -- catalog.json app/src/main/assets/catalog.json; then
            echo "Sin cambios"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json app/src/main/assets/catalog.json
          git commit -m "Catálogo actualizado desde onepace.net"
          git push

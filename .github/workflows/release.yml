name: Release

# Al subir un tag v* (por ejemplo v0.1.0) compila el APK firmado y lo adjunta a un GitHub Release.
# Secrets necesarios: SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD.
on:
  push:
    tags: ["v*"]

# Necesario para crear el Release. Acciones fijadas por SHA porque este job maneja la clave de firma.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # El APK firmado se compila desde cero, sin caché compartida con otros jobs.
          cache-disabled: true
      - name: Preparar clave de firma
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::Falta el secret SIGNING_KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Compilar APK firmado
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          OWNER: ${{ github.repository_owner }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease "-PgithubUser=$OWNER"
          cp app/build/outputs/apk/release/app-release.apk "MyOnePaceList-${GITHUB_REF_NAME}.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          sha256sum MyOnePaceList-*.apk > SHA256SUMS.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            MyOnePaceList-*.apk
            SHA256SUMS.txt
          generate_release_notes: true
